<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Готовлю как умею</title>
<meta name="description" content="Рецепты, меню на неделю и список покупок — вместе с друзьями.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: calm bento — soft white tiles on a light warm ground; a recipe opens as a grid of tiles: photo, info, oven plate, products, visual steps */
:root{
  --bg:#FAF7F1; --paper:#FFFFFF; --soft:#F4EFE5; --ink:#252525; --muted:#6F6A60; --line:#E9E2D4;
  --coral:#F04D36; --coral-ink:#FFFFFF; --coral-soft:#FDE5E0; --coral-text:#B32E1B;
  --lime:#E6FF56; --lime-soft:#F1F9CC; --lime-text:#4A5800;
  --sun:#F8D85B; --sun-soft:#FCF1C6; --sun-text:#765500;
  --bad:#C4321F; --bad-soft:#FDE8E4;
  --oven-bg:#252525; --oven-ink:#FAF7F1; --oven-num:#F8D85B;
  --display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171614; --paper:#211F1C; --soft:#2A2723; --ink:#F2EEE6; --muted:#ABA497; --line:#38332D;
  --coral:#FF6A52; --coral-ink:#1A0B07; --coral-soft:#3B201A; --coral-text:#FF9F8C;
  --lime:#E6FF56; --lime-soft:#2B3214; --lime-text:#DAF36C;
  --sun:#F8D85B; --sun-soft:#383017; --sun-text:#F4D46C;
  --bad:#FF8A78; --bad-soft:#3A1E19;
  --oven-bg:#0D0C0B; --oven-ink:#F2EEE6; --oven-num:#F8D85B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171614; --paper:#211F1C; --soft:#2A2723; --ink:#F2EEE6; --muted:#ABA497; --line:#38332D;
  --coral:#FF6A52; --coral-ink:#1A0B07; --coral-soft:#3B201A; --coral-text:#FF9F8C;
  --lime:#E6FF56; --lime-soft:#2B3214; --lime-text:#DAF36C;
  --sun:#F8D85B; --sun-soft:#383017; --sun-text:#F4D46C;
  --bad:#FF8A78; --bad-soft:#3A1E19;
  --oven-bg:#0D0C0B; --oven-ink:#F2EEE6; --oven-num:#F8D85B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.hint2{font-size:.9rem;color:var(--muted);margin:0}
.label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* auth + profile */
.auth{display:flex;flex-direction:column;gap:14px;background:var(--paper);border-radius:var(--r-lg);padding:28px;max-width:440px;margin:0 auto}
.auth .seg{align-self:flex-start;background:var(--soft);margin:0}
.auth label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;flex:1;min-width:0}
.auth input,.auth select{border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px 13px;background:var(--soft);font-weight:400;width:100%}
.auth input:focus,.auth select:focus{border-color:var(--ink);outline:none}
.auth .arow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.aerr{margin:0;color:var(--bad);font-size:.9rem;min-height:1em}
.pov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.ppanel{width:100%;max-height:90vh;overflow:auto}
.ppanel h2{font-size:1.4rem}
.hbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langbtn{position:absolute;top:0;right:0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:.85rem;letter-spacing:.04em;cursor:pointer}
.langbtn:hover{background:var(--soft)}
.untr{margin:0;font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.untr a{color:var(--ink)}
.profbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--paper);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-weight:600;color:var(--ink)}
.profbtn.guest{background:var(--ink);color:var(--paper);padding:10px 18px}
.profbtn .ava{width:32px;height:32px}
.byline{margin:0;display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:left;align-self:flex-start}
.byline .ava{width:40px;height:40px}
.byline b{color:var(--ink)}
.byline:hover b{text-decoration:underline}
.story{margin:0;font-style:italic;line-height:1.5;color:var(--ink);border-left:3px solid var(--line);padding-left:12px}
.story[data-ed]:empty::before{content:attr(data-ph);color:var(--muted)}
.cby{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-weight:600}
.cby .ava{width:22px;height:22px}
.people{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding:2px 2px 6px;margin:0 0 20px}
.pp{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);width:96px;flex:none;padding:4px 0}
.pp .ava{width:84px;height:84px}
.pp:hover .ava{transform:translateY(-2px)}
.pp .ava{transition:transform .15s}
.plabel{margin:0 0 10px}
.pp>span:not(.ava):not(.plus){max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .plus{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;color:var(--muted);background:var(--paper);border:2px dashed var(--line);box-sizing:border-box}
.phead{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center;margin:0 0 20px}
.phead .ava{width:110px;height:110px}
.phead h2{margin:0;font-family:var(--display);font-size:1.8rem}
.phead p{margin:2px 0 0}
.pstats b{color:var(--ink)}
.ava.avbig{width:72px;height:72px}
.avrow{display:flex;gap:16px;align-items:center}
.avbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pweek{margin-bottom:24px}
.pweek h3,.psub{margin:0 0 12px;font-size:1.15rem}
.wdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.wday{background:var(--soft);border-radius:12px;padding:10px 12px}
.wday b{display:block;margin-bottom:4px}
.wday ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.wday .wm{color:var(--muted);font-size:.78rem;margin-right:4px}
.wday a,.wfav a{color:var(--ink)}
.wfav{margin:12px 0 0;font-size:.9rem}
/* header */
header.top{position:relative;padding-top:44px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
header.top h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:.3em}
header.top h1 .star{width:.62em;height:.62em;color:var(--coral);flex:none}
header.top h1 .pan{width:.95em;height:.84em}
header.top h1 .pan .smoke{opacity:.55;animation:puff 2.4s ease-in-out infinite}
@keyframes puff{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-1.5px);opacity:.25}}
@media (prefers-reduced-motion:reduce){header.top h1 .pan .smoke{animation:none}}
header.top p{margin:8px 0 0;color:var(--muted);max-width:46ch}

/* buttons */
.btn{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none;transition:background .15s ease,transform .1s ease}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink);opacity:.88}
.btn.video{background:var(--coral);color:var(--coral-ink)}
.btn.video:hover{background:var(--coral);opacity:.9}
.btn.on{background:var(--sun-soft);color:var(--sun-text)}
.btn.back{background:none;padding:6px 2px;color:var(--muted);margin-bottom:16px}
.btn.back:hover{color:var(--ink);background:none}
.btn.link{background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 6px}
.btn.link:hover{color:var(--ink);background:none}
.btn svg{flex:none}
header.top .btn.primary{padding:13px 22px;font-size:1rem}

/* main tabs: both identical */
.seg{display:inline-flex;gap:6px;padding:6px;background:var(--paper);border-radius:999px;margin:0 0 22px;max-width:100%}
.seg button{border:0;background:none;color:var(--muted);border-radius:999px;padding:10px 20px;font-weight:600;font-size:1rem;cursor:pointer;display:inline-flex;gap:10px;align-items:center;white-space:nowrap;transition:background .15s ease,color .15s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.seg .cnt{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:24px;height:24px;border-radius:999px;display:inline-grid;place-items:center;padding:0 7px;background:var(--soft);color:var(--muted)}
.seg button[aria-current="page"] .cnt{background:var(--lime);color:#252525}
@media (max-width:480px){.seg{display:flex}.seg button{flex:1;justify-content:center;padding:10px 8px}}

/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:0;background:var(--paper);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:500;font-size:.92rem;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip .n{font-size:.8rem;opacity:.6;font-variant-numeric:tabular-nums}
.chip.gentle[aria-pressed="true"]{background:var(--lime-soft);color:var(--lime-text)}
.chip.std[aria-pressed="true"]{background:var(--sun-soft);color:var(--sun-text)}

/* recipe grid (bento) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;grid-auto-flow:dense}
.card{position:relative;background:var(--paper);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;transition:transform .2s ease}
.card:hover{transform:translateY(-3px)}
.card .open{all:unset;display:flex;flex-direction:column;cursor:pointer;flex:1;border-radius:var(--r-md)}
.card .open:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.ph{aspect-ratio:4/3;max-width:100%;width:100%;background:var(--soft);display:grid;place-items:center;overflow:hidden;border-radius:var(--r-md)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .glyph{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--muted);opacity:.35}
.card .body{padding:12px 8px 8px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-family:var(--body);font-size:1.15rem;font-weight:600;line-height:1.25}
.ph.noph{background:linear-gradient(135deg,var(--lime-soft),var(--sun-soft))}
.havebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}
.havelab{font-weight:600;font-size:.95rem;display:inline-flex;gap:6px;align-items:center}
.havebox{flex:1;min-width:240px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);border-radius:999px;padding:6px 8px 6px 14px;border:1.5px solid transparent}
.havebox:focus-within{border-color:var(--ink)}
.havebox input{flex:1;min-width:140px;border:0;background:none;padding:6px 4px;font-size:.95rem}
.havebox input:focus{outline:none}
.hchip{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 6px 4px 12px;font-size:.88rem;font-weight:600}
.hchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:.75rem;opacity:.8;padding:2px 4px}
.havehint{margin:-4px 0 14px}
.ingline.hv{white-space:normal;color:var(--ink)}
.ingline{margin:0;font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fht{margin:0;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fvid{position:absolute;top:20px;left:20px;z-index:2;display:inline-flex;gap:6px;align-items:center;background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.fvid:hover{background:var(--soft)}
.note.health{background:var(--lime-soft)}
.note.health b{color:var(--lime-text)}
.fdesc{margin:0;font-size:.92rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.finfo{display:flex;flex-wrap:wrap;gap:6px}
.finfo span{font-size:.82rem;background:var(--soft);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.fblock{display:flex;flex-direction:column;gap:6px;min-width:0}
.flab{margin:4px 0 0;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchips span{font-size:.84rem;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.fchips .more{color:var(--muted);border-style:dashed}
ol.fsteps{margin:0;padding:0;list-style:none;counter-reset:fs;display:flex;flex-direction:column;gap:4px}
ol.fsteps li{counter-increment:fs;display:flex;gap:8px;align-items:center;font-size:.9rem;min-width:0}
ol.fsteps li::before{content:counter(fs);flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.fmore{margin:0 0 0 28px;font-size:.82rem;color:var(--muted)}
@media (min-width:680px){
  .card.feat{grid-column:span 2;grid-row:span 2}
  .card.feat .ph{aspect-ratio:auto;flex:1;min-height:240px}
  .card.feat .body{gap:12px;flex:none;padding:16px 12px 12px}
  .card.feat .fdesc,.card.feat .fht{font-size:1rem}
  .card.feat .fchips span{font-size:.9rem;padding:3px 12px}
  .card.feat .flab{font-size:.74rem}
  .card.feat h3{font-family:var(--display);font-size:1.5rem;font-weight:600}
}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.done{background:var(--lime-soft);color:var(--lime-text)}
.pill.plan{background:var(--sun-soft);color:var(--sun-text)}
.pill.want{background:var(--coral-soft);color:var(--coral-text)}
.tagbtn{cursor:pointer;border:0;font:inherit;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tagbtn::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.6}
.tagbtn:hover,.tagbtn:focus-visible{filter:brightness(.95);outline:2px solid currentColor;outline-offset:1px}
.tagpop{position:absolute;z-index:60;background:var(--paper);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:240px;max-width:calc(100vw - 32px)}
.tagpop p{margin:0;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tagpop .row{display:flex;flex-wrap:wrap;gap:6px}
.tagpop button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.86rem;font-weight:600;border-radius:999px;padding:5px 12px;cursor:pointer}
.tagpop button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tagpop button.pill[aria-pressed="true"]{border-color:var(--ink);background:inherit;color:inherit;box-shadow:inset 0 0 0 1px var(--ink)}
.tagpop button.pill.done{background:var(--lime-soft);color:var(--lime-text);border-color:transparent}
.tagpop button.pill.plan{background:var(--sun-soft);color:var(--sun-text);border-color:transparent}
.pill.none{background:none;color:var(--muted);border:1.5px dashed var(--line)}
.tagpop button.pill.none{background:none;color:var(--muted);border:1.5px dashed var(--line)}
.tagpop button.pill.want{background:var(--coral-soft);color:var(--coral-text);border-color:transparent}
.tagpop button.pill[aria-pressed="true"]{border-color:var(--ink)}
.tag{font-size:.78rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px}
.ovenline{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.favbtn{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.favbtn.on{background:var(--sun);color:#252525}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--paper);border-radius:var(--r-lg)}

/* recipe sheet (bento tiles) */
.sheet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:start}
.tile{background:var(--paper);border-radius:var(--r-lg);padding:24px;min-width:0}
.tile.photo{grid-column:span 3;grid-row:span 2;align-self:stretch;padding:0;overflow:hidden;min-height:320px;background:var(--soft);display:grid;place-items:center}
.tile.photo img{width:100%;height:100%;object-fit:cover}
/* photo follows the height of the info + oven tiles instead of stretching the row */
.tile.photo{position:relative;min-height:240px}
.tile.photo img{position:absolute;inset:0;display:block}
.tile.photo .glyph{font-family:var(--display);font-size:5rem;font-weight:700;color:var(--muted);opacity:.3}
.tile.info{grid-column:span 3;display:flex;flex-direction:column;gap:14px}
.sheet:not(:has(.oven)) .tile.info{grid-row:span 2;align-self:stretch}
.tile.info h2{font-size:clamp(1.5rem,3.4vw,2.2rem)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.tile.oven{grid-column:span 3;background:var(--oven-bg);color:var(--oven-ink);display:flex;flex-direction:column;gap:6px}
.tile.oven .ol{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:600}
.tile.oven b{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.3rem);font-weight:600;color:var(--oven-num);font-variant-numeric:tabular-nums;line-height:1.15}
.tile.oven small{font-size:.92rem;opacity:.85}
.col.side{grid-column:span 2;display:flex;flex-direction:column;gap:14px;min-width:0}
.steps-tile{grid-column:span 4}
.gallery,.tools{grid-column:1/-1}
@media (max-width:820px){
  .sheet{grid-template-columns:minmax(0,1fr)}
  .sheet>*{grid-column:1/-1!important;grid-row:auto!important}
  .tile.photo{min-height:0;aspect-ratio:4/3;max-width:100%}
}
ul.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
/* products: main line = name + amount; second line = German name, notes, "optional" — always wraps, never pushes the layout */
ul.ing li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--soft)}
ul.ing li:last-child{border-bottom:0}
ul.ing .nm{min-width:0;overflow-wrap:anywhere;font-weight:500;line-height:1.35}
ul.ing .sub{display:block;font-size:.82rem;color:var(--muted);font-weight:400;line-height:1.35;margin-top:3px}
ul.ing .sub i{font-style:normal}
ul.ing .optp{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:1px}
ul.ing .amt{text-align:right;max-width:8.5em;font-size:.93rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

function ingKey(n){return String(n||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/ё/g,"е").trim()}
function fmtQ(q,u){if(u==="г"&&q>=1000)return (Math.round(q/100)/10).toString().replace(".",",")+" кг";if(u==="мл"&&q>=1000)return (Math.round(q/100)/10).toString().replace(".",",")+" л";return (Math.round(q*10)/10).toString().replace(".",",")+" "+u}
const SKIP=new Set(["вода"]);
const STAPLES=new Set(["перец","черный перец","перец черный","молотый перец","черный молотый перец","молотый черный перец"]);
function isStaple(k){return STAPLES.has(k)||k.startsWith("соль")}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function splitIng(i){const n=String(i.name||""),a=String(i.amount||"").trim();if(n.includes(",")&&!/\d/.test(a)){const parts=n.replace(/\(.*?\)/g,"").split(/\s*,\s*|\s+и\s+/).map(s=>s.trim()).filter(Boolean);if(parts.length>1&&parts.every(p=>p.split(/\s+/).length<=3))return parts.map(p=>({...i,name:cap(p),amount:a}))}return [i]}
function haveSet(list){const need=new Set(plan.need||[]),s=new Set(plan.have||[]);list.forEach(g=>{if(g.staple&&!need.has(g.key))s.add(g.key)});return s}
function isOpt(i){return !!i.optional||/по желанию/i.test(String(i.amount||"")+" "+String(i.name||""))}
const gN=g=>EN&&g.en?g.en:g.name;
function shoppingList(optional){const inc=new Set(plan.opt||[]);const map=new Map();scheduled().forEach(id=>{const r=recipesRU.find(x=>x.id===id);if(!r)return;const rl=EN?locR(r):null,tt=rl?rl.title:r.title;const b=baseServes(r),fac=b?planPortions(r)/b:1;(r.ingredients||[]).map(normIng).map((i,k)=>({...i,amount:scaleAmt(i.amount,fac),_en:rl&&rl.ingredients&&rl.ingredients[k]?rl.ingredients[k].name:""})).flatMap(x=>{const sp=splitIng(x);return sp.length>1?sp.map(y=>({...y,_en:""})):sp}).forEach(i=>{const k=ingKey(i.name);if(!k||SKIP.has(k))return;const o=isOpt(i);if(optional?!o:(o&&!inc.has(k)))return;if(!map.has(k))map.set(k,{key:k,name:String(i.name).replace(/\s*\(.*?\)\s*/g," ").trim(),sums:{},other:[],from:[],approx:false,staple:isStaple(k),en:i._en||""});const g=map.get(k);const p=parseAmt(i.amount);if(p){g.sums[p.u]=(g.sums[p.u]||0)+p.q;if(p.approx)g.approx=true}else if(i.amount)g.other.push(String(i.amount).replace(/,?\s*по желанию/i,"").trim()||"по желанию");if(!g.from.includes(tt))g.from.push(tt)})});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"ru"))}

function renderImport(){const st=importing;

    th.querySelectorAll(".th img").forEach((im,ix)=>{im.src=URL.createObjectURL(fs[ix])});
    th.querySelectorAll("[data-rmf]").forEach(b=>b.onclick=()=>{st.files=fs.filter((_,j)=>j!==+b.dataset.rmf);showTh()});
    const inp=document.getElementById("im_img");if(inp)inp.onchange=()=>{st.files=[...fs,...inp.files].slice(0,4);showTh()}};
  showTh();

    if(!sample){toast("Импорт с ИИ недоступен в этом просмотре");return}
    const stEl=document.getElementById("im_st");stEl.textContent="Разбираю рецепт… это займёт до минуты";document.getElementById("im_go").disabled=true;
    const prompt=`Ты помогаешь вести личный банк рецептов. Ниже рецепт из видео (текст и/или скриншоты). Сделай из него карточку на русском языке.
Правила:
- Переведи на русский. Каждый продукт раздели на ВАЖНОЕ и ДОПОЛНИТЕЛЬНОЕ:
  name — только короткое русское название, без скобок и пояснений («Сливочный сыр»);
  de — немецкое название для поиска в EDEKA («Frischkäse»);
  amount — только число + единица, коротко (г, кг, мл, л, шт., ст. л., ч. л.): «200 г», «3 шт.», «½ ч. л.». Без пояснений и скобок;
  note — всё дополнительное: «лучше кисловатые», «~500 г», «в оригинале 200 г», «комнатной температуры». Если нечего — "";
  optional — true, если продукт необязательный;
  group — "" для основных продуктов; «Для формы» или «Для подачи» для того, что не входит в само блюдо.
- Никаких расплывчатых количеств вроде «немного»: дай конкретную меру (например, масло для формы — «1 ч. л.»). Для соли/специй можно «щепотка» (≈ ⅛ ч. л.) или «по вкусу». Не придумывай количества основных продуктов: если в источнике их нет, amount «?» и упомяни это в notes.
- steps: очень простые короткие шаги, как для ребёнка: размер нарезки, огонь (слабый/средний/сильный), минуты, как понять, что можно переходить дальше. Нет миксера и блендера — предложи замену (вилка/венчик).
- oven: «180 °C · 25 мин» если есть духовка, иначе "". ovenNote: режим (верх/низ нагрев или конвекция), уровень, бумага/фольга.
- stepTitles: для каждого шага заголовок из 1–2 слов — что берём в руки или что происходит: «Яблоки», «Духовка», «Тесто», «Выпечка». Столько же элементов, сколько в steps.
- whole: true, если блюдо готовится целиком в форме (пирог, киш, торт, запеканка-пирог), иначе false.
- serves: число — на сколько порций рассчитаны количества (если в источнике кусочки или штуки, переведи в порции; если неизвестно — 2).
- health: 1–2 коротких предложения «чем полезно это блюдо» — только общеизвестные факты о продуктах (белок, клетчатка, витамины), без медицинских обещаний; если блюдо жирное или сладкое, честно скажи это мягко.
- tips: 3–5 типичных ошибок, из-за которых блюдо портится, и как их избежать.
- gentle: true только если блюдо запечённое/варёное, нежирное, не острое, без большого количества томатов, цитрусовых, сырого лука и чеснока.
- easy: true если активной работы до 30 минут.
Ответь ТОЛЬКО JSON-объектом с полями: title, serves (число), whole, servings, time, oven, ovenNote, ingredients (массив {name, de, amount, note, optional, group}), before, health, steps (массив строк), stepTitles (массив строк), done, storage, tips (массив строк), notes, easy, gentle.

${st.text||"(только скриншоты)"}`;

    catch(e){st.status=e.code==="not_granted"?"Нужно разрешить странице обращаться к Claude.":"Не получилось: "+(e.message||e.code);importing=st;render()}};

document.addEventListener("paste",async e=>{

  if(!f)return;const r=recipes.find(x=>x.id===openId);if(!r)return;e.preventDefault();
  if(pasteStep==="main")return setPhoto(r,"main",f);
  if(pasteStep==="ing")return setPhoto(r,"ing",f);

  if(n===null){n=r.steps.findIndex((_,i)=>!sp[i]);if(n<0){toast("Выдели карточку, фото которой заменить");return}}
  setPhoto(r,n,f)});
